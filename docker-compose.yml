version: '3.8'

services:
  goodberry-backend:
    image: ghcr.io/${REGISTRY_OWNER}/goodberry-backend:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: goodberry-backend
    restart: always
    env_file:
      - .env
    environment:
      - VIRTUAL_PORT=5000
    networks:
      - web-network

  goodberry-frontend:
    image: ghcr.io/${REGISTRY_OWNER}/goodberry-frontend:latest
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: goodberry-frontend
    restart: always
    env_file:
      - .env
    environment:
      - VIRTUAL_PORT=80
    networks:
      - web-network

networks:
  web-network:
    external: true
